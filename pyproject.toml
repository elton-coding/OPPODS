[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oppods-df1176"
version = "0.1.0"
description = "DataFountain 1176 MU-MIMO competition research code"
requires-python = ">=3.9,<3.14"
dependencies = [
  "numpy==1.26.4",
  "torch==2.10.0",
  "scipy>=1.11,<1.15",
  "PyYAML>=6.0,<7",
  "tqdm>=4.66,<5",
  "tensorboard>=2.16,<3",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"modelSubmit/*.py" = ["N999"]
